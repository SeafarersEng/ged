<!DOCTYPE html>
<html lang="my" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f8fafc">
<title>GED Science — Full Course (1,800 Exercises)</title>
<script>
(function () {
  try {
    var t = localStorage.getItem('ged:theme');
    if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8fafc;--card:#fff;--text:#1e293b;--muted:#64748b;--border:rgba(15,23,42,.09);
--green:#16a34a;--red:#dc2626;--amber:#f59e0b;--radius:18px;--safe-top:env(safe-area-inset-top,0px);
--safe-bottom:env(safe-area-inset-bottom,0px);--shadow:0 1px 3px rgba(15,23,42,.05),0 8px 24px -12px rgba(15,23,42,.15);
--shadow-lg:0 4px 8px rgba(15,23,42,.06),0 20px 40px -16px rgba(15,23,42,.22);--ac:#10b981}
html[data-theme="dark"]{--bg:#0b1220;--card:#141d30;--text:#e9eefb;--muted:#93a4c2;--border:rgba(255,255,255,.09);
--shadow:0 2px 4px rgba(0,0,0,.3),0 16px 34px -18px rgba(0,0,0,.75);--shadow-lg:0 8px 20px rgba(0,0,0,.45),0 28px 50px -20px rgba(0,0,0,.85)}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100svh;font-family:'Inter','Noto Sans Myanmar','Padauk',system-ui,-apple-system,sans-serif;
background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden;transition:background .35s,color .35s}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
background:radial-gradient(700px 420px at 8% -8%,rgba(16,185,129,.10),transparent 65%),
radial-gradient(700px 420px at 100% 4%,rgba(59,130,246,.08),transparent 65%)}
html[data-theme="dark"] body::before{opacity:.55}
.screen{display:none;min-height:100svh;padding-bottom:calc(40px + var(--safe-bottom))}
.screen.active{display:block}
.home-top{padding:calc(28px + var(--safe-top)) 20px 20px;max-width:1080px;margin:0 auto;text-align:center}
.home-top .logo{width:64px;height:64px;border-radius:18px;margin:0 auto 16px;display:grid;place-items:center;
font-size:15px;font-weight:800;letter-spacing:.5px;color:#fff;background:linear-gradient(135deg,#10b981,#06b6d4);
box-shadow:0 12px 28px -10px rgba(16,185,129,.8)}
.home-top h1{margin:0 0 6px;font-size:clamp(22px,5.5vw,32px);font-weight:800;letter-spacing:-.03em;line-height:1.2}
.home-top p{margin:0;color:var(--muted);font-size:clamp(13px,3.4vw,15px)}
.overall{max-width:440px;margin:20px auto 0;background:var(--card);border:1px solid var(--border);
border-radius:14px;padding:14px 18px;box-shadow:var(--shadow)}
.overall-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.overall-row b{font-size:22px;font-weight:800;color:var(--ac)}
.overall-row span{font-size:12.5px;color:var(--muted);font-weight:600}
.overall-bar{height:8px;border-radius:999px;background:rgba(15,23,42,.07);overflow:hidden}
html[data-theme="dark"] .overall-bar{background:rgba(255,255,255,.09)}
.overall-bar i{display:block;height:100%;width:0;border-radius:999px;
background:linear-gradient(90deg,var(--ac),#06b6d4);transition:width .6s cubic-bezier(.22,.8,.28,1)}
.grid{max-width:1080px;margin:0 auto;padding:0 16px;display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:600px){.grid{grid-template-columns:repeat(2,1fr);gap:16px}}
@media(min-width:960px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{position:relative;display:flex;flex-direction:column;padding:20px;border-radius:var(--radius);
background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);cursor:pointer;
transition:transform .28s cubic-bezier(.22,.8,.28,1),box-shadow .28s,border-color .28s;overflow:hidden;
font-family:inherit;text-align:left;color:inherit;animation:cardIn .5s cubic-bezier(.22,.8,.28,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@media(hover:hover){
.card:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg);border-color:var(--c)}
.card:hover .c-icon{transform:scale(1.08) rotate(-5deg)}
.card:hover .c-arrow{transform:translateX(4px);background:var(--c);color:#fff;border-color:transparent}}
.card:active{transform:scale(.982)}
.c-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.c-icon{width:52px;height:52px;flex:none;display:grid;place-items:center;font-size:26px;
border-radius:16px;transition:transform .3s cubic-bezier(.22,.8,.28,1)}
.c-arrow{width:30px;height:30px;flex:none;display:grid;place-items:center;font-size:14px;
border-radius:50%;border:1px solid var(--border);color:var(--muted);
transition:transform .28s,background .28s,color .28s,border-color .28s}
.card h3{margin:14px 0 0;font-size:16px;font-weight:700;letter-spacing:-.01em;line-height:1.35}
.card .c-desc{margin:5px 0 0;font-size:12.5px;color:var(--muted);line-height:1.7;flex:1}
.c-meta{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:14px;
border-top:1px solid var(--border);font-size:12px;font-weight:600;color:var(--muted)}
.c-meta b{color:var(--c);font-weight:800;font-size:13px}
.c-bar{height:6px;border-radius:999px;background:rgba(15,23,42,.07);overflow:hidden;margin-top:8px}
html[data-theme="dark"] .c-bar{background:rgba(255,255,255,.09)}
.c-bar i{display:block;height:100%;width:0;border-radius:999px;background:var(--c);
transition:width .6s cubic-bezier(.22,.8,.28,1)}
.lesson-list{max-width:880px;margin:0 auto;padding:0 16px;display:flex;flex-direction:column;gap:10px}
.lesson-row{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--card);
border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);cursor:pointer;
font-family:inherit;text-align:left;color:inherit;transition:transform .2s,box-shadow .25s,border-color .25s;
animation:cardIn .4s cubic-bezier(.22,.8,.28,1) both}
@media(hover:hover){.lesson-row:hover{transform:translateX(4px);box-shadow:var(--shadow-lg);border-color:var(--ac)}}
.lesson-row:active{transform:scale(.985)}
.l-id{flex:none;font-size:12.5px;font-weight:800;color:#fff;padding:5px 10px;border-radius:10px;
background:linear-gradient(135deg,var(--ac),#06b6d4);font-variant-numeric:tabular-nums;min-width:46px;text-align:center}
.l-body{flex:1;min-width:0}
.l-body h4{margin:0;font-size:14.5px;font-weight:700;line-height:1.35;letter-spacing:-.01em}
.l-body p{margin:3px 0 0;font-size:11.5px;color:var(--muted);font-weight:600}
.l-prog{flex:none;width:60px;text-align:right}
.l-prog b{display:block;font-size:12px;color:var(--ac);font-weight:800;font-variant-numeric:tabular-nums}
.l-prog .bar{height:5px;border-radius:999px;background:rgba(15,23,42,.08);overflow:hidden;margin-top:5px}
html[data-theme="dark"] .l-prog .bar{background:rgba(255,255,255,.08)}
.l-prog .bar i{display:block;height:100%;width:0;border-radius:999px;background:var(--ac);
transition:width .5s cubic-bezier(.22,.8,.28,1)}
.gv-header{position:sticky;top:0;z-index:30;background:rgba(248,250,252,.92);backdrop-filter:blur(14px);
-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:calc(10px + var(--safe-top)) 16px 12px}
html[data-theme="dark"] .gv-header{background:rgba(11,18,32,.92)}
.gv-header-inner{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:12px}
.back-btn{display:inline-flex;align-items:center;gap:6px;flex:none;padding:9px 14px;border-radius:12px;
border:1px solid var(--border);background:var(--card);color:var(--text);font-family:inherit;font-size:13px;
font-weight:700;cursor:pointer;box-shadow:var(--shadow);transition:transform .18s;text-decoration:none}
.back-btn:active{transform:scale(.95)}
.gv-title{flex:1;min-width:0}
.gv-title h2{margin:0;font-size:clamp(14px,3.8vw,17px);font-weight:800;letter-spacing:-.01em;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gv-title p{margin:2px 0 0;font-size:11.5px;color:var(--muted);font-weight:500}
.prog-head{max-width:960px;margin:14px auto 0;padding:0 16px}
.prog-head-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.prog-head-top b{font-size:15px;font-weight:800;color:var(--ac)}
.prog-head-top span{font-size:11.5px;color:var(--muted);font-weight:600}
.prog-head-bar{height:7px;border-radius:999px;background:rgba(15,23,42,.07);overflow:hidden}
html[data-theme="dark"] .prog-head-bar{background:rgba(255,255,255,.09)}
.prog-head-bar i{display:block;height:100%;width:0;border-radius:999px;background:var(--ac);
transition:width .5s cubic-bezier(.22,.8,.28,1)}
.toolbar{max-width:960px;margin:14px auto 0;padding:0 16px;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:12px;
border:1px solid var(--border);background:var(--card);color:var(--text);font-family:inherit;
font-size:12.5px;font-weight:600;cursor:pointer;box-shadow:0 1px 3px rgba(15,23,42,.04);
transition:transform .18s,background .2s,color .2s}
.btn:active{transform:scale(.96)}
.btn.danger{color:var(--red);border-color:rgba(220,38,38,.3)}
#exerciseList{max-width:960px;margin:0 auto;padding:16px}
.exercise{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
padding:18px;margin-bottom:12px;box-shadow:var(--shadow);animation:fadeUp .35s cubic-bezier(.22,.8,.28,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ex-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ex-num{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 8px;border-radius:10px;
font-size:12.5px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--ac),#06b6d4);
font-variant-numeric:tabular-nums}
.ex-status{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;color:var(--muted);
background:rgba(15,23,42,.06)}
html[data-theme="dark"] .ex-status{background:rgba(255,255,255,.08)}
.ex-status.correct{color:#14532d;background:#bbf7d0}
.ex-status.wrong{color:#7f1d1d;background:#fecaca}
.ex-q{font-size:14.5px;line-height:1.7;margin:6px 0 14px;font-weight:500}
.ex-q b{font-weight:800}
.passage{background:rgba(16,185,129,.05);border-left:3px solid var(--ac);
padding:12px 14px;border-radius:8px;margin:10px 0;font-size:13.5px;line-height:1.8}
html[data-theme="dark"] .passage{background:rgba(16,185,129,.1)}
.ex-opts{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:520px){.ex-opts{grid-template-columns:1fr 1fr}}
.opt{text-align:left;padding:12px 14px;border-radius:12px;border:1.5px solid var(--border);
background:var(--card);color:var(--text);font-family:inherit;font-size:13.5px;font-weight:500;
cursor:pointer;transition:all .18s;line-height:1.5}
.opt:active{transform:scale(.98)}
.opt:not(:disabled):hover{border-color:var(--ac);background:rgba(16,185,129,.04)}
.opt:disabled{cursor:default;opacity:.95}
.opt.correct{background:#dcfce7;border-color:var(--green);color:#14532d;font-weight:700}
html[data-theme="dark"] .opt.correct{background:rgba(22,163,74,.2);color:#86efac}
.opt.wrong{background:#fee2e2;border-color:var(--red);color:#7f1d1d}
html[data-theme="dark"] .opt.wrong{background:rgba(220,38,38,.2);color:#fca5a5}
.opt .ltr{font-weight:800;margin-right:6px;color:var(--muted)}
.opt.correct .ltr{color:#14532d}
.opt.wrong .ltr{color:#7f1d1d}
.ex-actions{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.show-sol{padding:8px 13px;border-radius:10px;border:1px dashed rgba(245,158,11,.6);
background:rgba(245,158,11,.08);color:#92400e;font-family:inherit;font-size:12.5px;
font-weight:700;cursor:pointer;transition:all .18s}
html[data-theme="dark"] .show-sol{background:rgba(245,158,11,.15);color:#fbbf24}
.show-sol:active{transform:scale(.97)}
.show-sol.open{background:var(--amber);color:#fff;border-style:solid;border-color:transparent}
.ex-sol{margin-top:12px;padding:16px;border-radius:12px;background:rgba(16,185,129,.06);
border-left:3px solid var(--ac);font-size:13.5px;line-height:1.8;animation:fadeUp .3s ease both}
html[data-theme="dark"] .ex-sol{background:rgba(16,185,129,.12)}
.ex-sol .sol-lbl{display:block;font-weight:800;font-size:11px;color:var(--ac);
text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.ex-sol .sol-why{margin-bottom:14px}
.ex-sol ol{margin:6px 0 0;padding-left:20px}
.ex-sol ol li{margin-bottom:5px;line-height:1.7}
.ex-sol .sol-ans{display:inline-block;margin-top:12px;padding:5px 12px;border-radius:8px;
background:#dcfce7;color:#14532d;font-weight:800;font-size:13px}
.hidden{display:none!important}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div id="homeScreen" class="screen active">
  <div class="home-top">
    <div class="logo">GED</div>
    <h1>GED Science — Full Course</h1>
    <p>6 Groups · 60 Lessons · 1,800 Practice Questions</p>
    <div class="overall">
      <div class="overall-row"><b id="overallPct">0%</b><span id="overallCount">0 / 1,800 ပြီးစီး</span></div>
      <div class="overall-bar"><i id="overallBar"></i></div>
    </div>
  </div>
  <div class="grid" id="groupGrid"></div>
</div>

<div id="groupScreen" class="screen">
  <div class="gv-header">
    <div class="gv-header-inner">
      <button class="back-btn" id="backFromGroup">← Back</button>
      <div class="gv-title"><h2 id="gTitle"></h2><p id="gSub"></p></div>
    </div>
  </div>
  <div class="prog-head">
    <div class="prog-head-top"><b id="gPct">0%</b><span id="gCount">0 / 300</span></div>
    <div class="prog-head-bar"><i id="gBar"></i></div>
  </div>
  <div class="lesson-list" id="lessonList"></div>
</div>

<div id="lessonScreen" class="screen">
  <div class="gv-header">
    <div class="gv-header-inner">
      <button class="back-btn" id="backFromLesson">← Back</button>
      <div class="gv-title"><h2 id="lTitle"></h2><p id="lSub"></p></div>
    </div>
  </div>
  <div class="prog-head">
    <div class="prog-head-top"><b id="lPct">0%</b><span id="lCount">0 / 30</span></div>
    <div class="prog-head-bar"><i id="lBar"></i></div>
  </div>
  <div class="toolbar">
    <button class="btn" id="btnShowAll">💡 Show All Answers</button>
    <button class="btn" id="btnHideAll">🙈 Hide All Answers</button>
    <button class="btn danger" id="btnReset">🔄 Reset</button>
  </div>
  <div id="exerciseList"></div>
</div>

<script>
/* HELPERS */
var sr=function(s){var x=Math.sin(s*12.9898+78.233)*43758.5453;return x-Math.floor(x)};
var ri=function(s,a,b){return Math.floor(sr(s)*(b-a+1))+a};
var pick=function(s,arr){return arr[Math.floor(sr(s)*arr.length)]};
var shuffle=function(a,s){var r=a.slice();for(var i=r.length-1;i>0;i--){var j=Math.floor(sr(s+i*13.37)*(i+1));var t=r[i];r[i]=r[j];r[j]=t}return r};
function mcq(correct,distractors,seed){
  var c=String(correct);var opts=[c];
  for(var i=0;i<distractors.length;i++){if(opts.length>=4)break;var d=String(distractors[i]);if(d!==c&&opts.indexOf(d)===-1)opts.push(d)}
  var k=1;
  while(opts.length<4){opts.push(c+' (v'+k+')');k++;if(k>10)break}
  var sh=shuffle(opts,seed);return{options:sh,correctIndex:sh.indexOf(c)};
}
function Q(q,correct,dist,why,steps,seed){
  var m=mcq(correct,dist,seed);
  return{q:q,options:m.options,correctIndex:m.correctIndex,why:why,steps:steps,answer:String(correct)};
}

/* ============================================================
   GROUP 1 — LIFE SCIENCE: CELL BIOLOGY
============================================================ */
var G1 = [
// 1.1 Cell Theory
function(s){
  var items=[
    ['All living things are made of ____.','cells',['atoms','organs','tissues'],
     'Cell Theory ၏ အခြေခံ — သက်ရှိအားလုံးသည် ဆဲလ်များဖြင့် ဖွဲ့စည်းထားသည်။',
     ['သက်ရှိအားလုံး = cells','Cell = life ၏ အခြေခံယူနစ်','အဖြေ = cells']],
    ['The basic unit of life is the ____.','cell',['atom','molecule','organ'],
     'ဆဲလ်သည် သက်ရှိတို့၏ အသေးဆုံးယူနစ် ဖြစ်သည်။',
     ['Cell = basic unit of life','→ cell']],
    ['Which scientist first observed cells under a microscope?','Robert Hooke',['Charles Darwin','Gregor Mendel','Isaac Newton'],
     'Robert Hooke သည် 1665 ခုနှစ်တွင် cork ကို ကြည့်ရင်း cell ဟူသော ဝေါဟာရကို စတင်သုံးခဲ့သည်။',
     ['1665, Robert Hooke','Cork cells','→ Hooke']],
    ['Which of these is NOT part of the cell theory?','Cells can arise from non-living matter',['All living things are made of cells','Cells are the basic unit of life','All cells come from existing cells'],
     'Cell Theory: ဆဲလ်အားလုံးသည် ရှိပြီးသား ဆဲလ်များမှ ဆင်းသက်သည်။',
     ['Cell theory ၃ ချက်','Spontaneous generation မဟုတ်','→ ရွေးချယ်စရာ ၁']],
    ['Prokaryotic cells lack a ____.','nucleus',['cell membrane','cytoplasm','ribosome'],
     'Prokaryotes တွင် nucleus မရှိ။ DNA သည် cytoplasm ထဲ လွတ်လပ်စွာ ရှိသည်။',
     ['Prokaryote = no nucleus','Bacteria = example','→ nucleus']]
  ];
  var it=pick(s,items);
  return Q(it[0],it[1],it[2],it[3],it[4],s+1);
},
// 1.2 Cell Organelles
function(s){
  var items=[
    ['Which organelle produces ATP (energy)?','Mitochondria',['Nucleus','Ribosome','Golgi apparatus'],
     'Mitochondria သည် cellular respiration မှတစ်ဆင့် ATP ထုတ်လုပ်သည်။',
     ['Cellular respiration = ATP','Mitochondria = powerhouse','→ Mitochondria']],
    ['Which organelle controls cell activities and stores DNA?','Nucleus',['Mitochondria','Vacuole','Lysosome'],
     'Nucleus သည် DNA သိမ်းဆည်းပြီး ဆဲလ်လုပ်ဆောင်ချက်များကို ထိန်းချုပ်သည်။',
     ['Nucleus = control center','DNA storage','→ Nucleus']],
    ['Which organelle builds proteins?','Ribosome',['Mitochondria','Vacuole','Chloroplast'],
     'Ribosomes သည် amino acids များကို ပေါင်းစပ်ပြီး protein များ တည်ဆောက်သည်။',
     ['Ribosome = protein synthesis','→ Ribosome']],
    ['Which organelle is found in plant cells but not animal cells?','Chloroplast',['Mitochondria','Nucleus','Ribosome'],
     'Chloroplast သည် photosynthesis အတွက် လိုအပ်သည်။ အပင်ဆဲလ်များတွင်သာ ရှိသည်။',
     ['Photosynthesis = chloroplast','Plant only','→ Chloroplast']],
    ['What is the function of the cell membrane?','Controls what enters and exits the cell',['Produces energy','Stores DNA','Builds proteins'],
     'Cell membrane သည် semi-permeable ဖြစ်ပြီး ဆဲလ်ထဲဝင်/ထွက်သည့် အရာများကို ထိန်းချုပ်သည်။',
     ['Semi-permeable barrier','Selective transport','→ Controls entry/exit']]

  {title:'Life Science: Cell Biology',icon:'🧬',ac:'#10b981',
   desc:'Cell structure, organelles, photosynthesis, respiration, division, DNA, genetics, evolution.',
   gens:G1,
   lessons:['Cell Theory','Cell Organelles','Photosynthesis','Cellular Respiration','Cell Division',
     'DNA & RNA','Protein Synthesis','Genetics & Heredity','Evolution & Natural Selection','Classification']},
  {title:'Life Science: Human Body & Ecosystems',icon:'🫀',ac:'#f43f5e',

   gens:G2,

     'Ecosystems','Biomes','Population Dynamics','Symbiosis','Human Impact']},

     'Solar System','Stars & Galaxies','Universe & Big Bang','Natural Disasters','Earth\'s History']},
  {title:'Scientific Reasoning & Data',icon:'🔬',ac:'#f59e0b',
   desc:'Scientific method, data interpretation, experimental design, graphs, cause/effect, ethics.',
   gens:G6,
   lessons:['Scientific Method','Data Interpretation','Experimental Design','Sci Notation & Units','Graphs & Charts',
     'Cause & Effect','Models & Theories','Measurement & Accuracy','Interpreting Tables','Bias & Ethics']}
];

var EX_PER_LESSON=30, EX_PER_GROUP=300, TOTAL_EX=1800;

/* STATE */
var STORE='ged:science:v1';
var progress={};
try{progress=JSON.parse(localStorage.getItem(STORE))||{}}catch(e){}
function save(){try{localStorage.setItem(STORE,JSON.stringify(progress))}catch(e){}}
function lessonKey(gi,li){return gi+'-'+li}
function lessonProg(gi,li){var k=lessonKey(gi,li);if(!progress[k])progress[k]={};return progress[k]}
var cache={};

/* SCREENS */
var homeScreen=document.getElementById('homeScreen');
var groupScreen=document.getElementById('groupScreen');
var lessonScreen=document.getElementById('lessonScreen');
var currentGroup=-1,currentLesson=-1;
function showOnly(s){
  [homeScreen,groupScreen,lessonScreen].forEach(function(x){x.classList.remove('active')});
  s.classList.add('active');window.scrollTo(0,0);
}

/* HOME */
var groupGrid=document.getElementById('groupGrid');
function buildHome(){
  groupGrid.innerHTML='';
  GROUPS.forEach(function(g,gi){
    var done=0;
    for(var li=0;li<10;li++){var p=progress[lessonKey(gi,li)]||{};Object.keys(p).forEach(function(k){if(p[k]===true)done++})}
    var pct=Math.round(done/EX_PER_GROUP*100);
    var card=document.createElement('button');
    card.className='card';card.style.setProperty('--c',g.ac);card.style.animationDelay=(gi*60)+'ms';
    card.innerHTML=
      '<div class="c-top"><span class="c-icon" style="background:'+g.ac+'1f">'+g.icon+'</span><span class="c-arrow">→</span></div>'+
      '<h3>Group '+(gi+1)+' — '+g.title+'</h3>'+
      '<p class="c-desc">'+g.desc+'</p>'+
      '<div class="c-meta"><span>10 lessons · 300 questions</span><b>'+pct+'%</b></div>'+
      '<div class="c-bar"><i style="width:'+pct+'%;background:'+g.ac+'"></i></div>';
    card.addEventListener('click',(function(idx){return function(){openGroup(idx)}})(gi));
    groupGrid.appendChild(card);
  });
  updateOverall();
}
function updateOverall(){
  var total=0;
  for(var gi=0;gi<6;gi++)for(var li=0;li<10;li++){var p=progress[lessonKey(gi,li)]||{};Object.keys(p).forEach(function(k){if(p[k]===true)total++})}
  var pct=Math.round(total/TOTAL_EX*100);
  document.getElementById('overallPct').textContent=pct+'%';
  document.getElementById('overallCount').textContent=total.toLocaleString()+' / '+TOTAL_EX.toLocaleString()+' ပြီးစီး';
  document.getElementById('overallBar').style.width=pct+'%';
}

/* GROUP VIEW */
var lessonListEl=document.getElementById('lessonList');
function openGroup(gi){
  currentGroup=gi;var g=GROUPS[gi];
  document.documentElement.style.setProperty('--ac',g.ac);
  document.getElementById('gTitle').textContent='Group '+(gi+1)+' — '+g.title;
  document.getElementById('gSub').textContent=g.desc;
  buildLessonList(gi);refreshGroupStats(gi);showOnly(groupScreen);
}
function buildLessonList(gi){
  var g=GROUPS[gi];lessonListEl.innerHTML='';
  g.lessons.forEach(function(title,li){
    var p=progress[lessonKey(gi,li)]||{};var done=0;
    Object.keys(p).forEach(function(k){if(p[k]===true)done++});
    var pct=Math.round(done/EX_PER_LESSON*100);
    var row=document.createElement('button');
    row.className='lesson-row';row.style.animationDelay=(li*40)+'ms';
    row.innerHTML=
      '<span class="l-id">'+(gi+1)+'.'+(li+1)+'</span>'+
      '<div class="l-body"><h4>'+title+'</h4><p>'+EX_PER_LESSON+' exercises</p></div>'+
      '<div class="l-prog"><b>'+done+'/'+EX_PER_LESSON+'</b><div class="bar"><i style="width:'+pct+'%;background:'+g.ac+'"></i></div></div>';
    row.addEventListener('click',(function(g2,l2){return function(){openLesson(g2,l2)}})(gi,li));
    lessonListEl.appendChild(row);
  });
}
function refreshGroupStats(gi){
  if(gi!==currentGroup)return;
  var done=0;
  for(var li=0;li<10;li++){var p=progress[lessonKey(gi,li)]||{};Object.keys(p).forEach(function(k){if(p[k]===true)done++})}
  var pct=Math.round(done/EX_PER_GROUP*100);
  document.getElementById('gPct').textContent=pct+'%';
  document.getElementById('gCount').textContent=done+' / '+EX_PER_GROUP;
  document.getElementById('gBar').style.width=pct+'%';
}
document.getElementById('backFromGroup').addEventListener('click',function(){buildHome();showOnly(homeScreen)});

/* LESSON VIEW */
var exerciseList=document.getElementById('exerciseList');
function generateLesson(gi,li){
  var key=lessonKey(gi,li);if(cache[key])return cache[key];
  var gen=GROUPS[gi].gens[li];var arr=[];
  for(var i=0;i<EX_PER_LESSON;i++){var seed=gi*1000000+li*1000+i*17+13;arr.push(gen(seed))}
  cache[key]=arr;return arr;
}
function openLesson(gi,li){
  currentGroup=gi;currentLesson=li;var g=GROUPS[gi];
  document.documentElement.style.setProperty('--ac',g.ac);
  document.getElementById('lTitle').textContent=(gi+1)+'.'+(li+1)+' — '+g.lessons[li];
  document.getElementById('lSub').textContent='Group '+(gi+1)+' · '+EX_PER_LESSON+' exercises';
  var arr=generateLesson(gi,li);
  renderExercises(arr,gi,li);refreshLessonStats(gi,li);showOnly(lessonScreen);
}
function refreshLessonStats(gi,li){
  if(gi!==currentGroup||li!==currentLesson)return;
  var p=progress[lessonKey(gi,li)]||{};var done=0;
  Object.keys(p).forEach(function(k){if(p[k]===true)done++});
  var pct=Math.round(done/EX_PER_LESSON*100);
  document.getElementById('lPct').textContent=pct+'%';
  document.getElementById('lCount').textContent=done+' / '+EX_PER_LESSON;
  document.getElementById('lBar').style.width=pct+'%';
}

var LTRS=['A','B','C','D'];
function renderExercises(arr,gi,li){
  var p=lessonProg(gi,li);exerciseList.innerHTML='';
  var frag=document.createDocumentFragment();
  arr.forEach(function(e,idx){frag.appendChild(buildCard(e,idx,gi,li,p[idx]))});
  exerciseList.appendChild(frag);
}
function buildCard(e,idx,gi,li,saved){
  var wrap=document.createElement('div');wrap.className='exercise';
  var status=saved===true?'<span class="ex-status correct">✔ Correct</span>'
    :saved===false?'<span class="ex-status wrong">✘ Wrong</span>'
    :'<span class="ex-status">— Not answered</span>';
  wrap.innerHTML=
    '<div class="ex-head"><span class="ex-num">'+(idx+1)+'</span>'+status+'</div>'+
    '<div class="ex-q">'+e.q+'</div>'+
    '<div class="ex-opts">'+e.options.map(function(o,i){
      return '<button class="opt" data-i="'+i+'"><span class="ltr">'+LTRS[i]+'.</span>'+o+'</button>';
    }).join('')+'</div>'+
    '<div class="ex-actions"><button class="show-sol">💡 Show Answer</button></div>'+
    '<div class="ex-sol hidden">'+
      '<div class="sol-why"><span class="sol-lbl">အဘယ်ကြောင့်</span>'+e.why+'</div>'+
      '<div><span class="sol-lbl">ရှင်းလင်းချက် အဆင့်ဆင့်</span><ol>'+
        e.steps.map(function(s){return '<li>'+s+'</li>'}).join('')+
      '</ol></div>'+
      '<span class="sol-ans">✔ အဖြေ: '+e.answer+'</span>'+
    '</div>';
  var opts=wrap.querySelectorAll('.opt');
  var solBox=wrap.querySelector('.ex-sol');
  var solBtn=wrap.querySelector('.show-sol');
  var statusEl=wrap.querySelector('.ex-status');
  if(saved===true||saved===false){
    opts.forEach(function(b,i){b.disabled=true;if(i===e.correctIndex)b.classList.add('correct')});
  }
  opts.forEach(function(b,i){
    b.addEventListener('click',function(){
      if(b.disabled)return;
      var ok=i===e.correctIndex;
      opts.forEach(function(x){x.disabled=true});
      b.classList.add(ok?'correct':'wrong');
      if(!ok)opts[e.correctIndex].classList.add('correct');
      statusEl.className='ex-status '+(ok?'correct':'wrong');
      statusEl.textContent=ok?'✔ Correct':'✘ Wrong';
      lessonProg(gi,li)[idx]=ok;save();refreshLessonStats(gi,li);
      if(!ok){solBox.classList.remove('hidden');solBtn.classList.add('open');solBtn.textContent='🙈 Hide Answer'}
    });
  });
  solBtn.addEventListener('click',function(){
    solBox.classList.toggle('hidden');
    var open=!solBox.classList.contains('hidden');
    solBtn.classList.toggle('open',open);
    solBtn.textContent=open?'🙈 Hide Answer':'💡 Show Answer';
  });
  return wrap;
}
document.getElementById('backFromLesson').addEventListener('click',function(){
  buildLessonList(currentGroup);refreshGroupStats(currentGroup);showOnly(groupScreen);
});

/* TOOLBAR */
document.getElementById('btnShowAll').addEventListener('click',function(){
  exerciseList.querySelectorAll('.ex-sol').forEach(function(b){b.classList.remove('hidden')});
  exerciseList.querySelectorAll('.show-sol').forEach(function(b){b.classList.add('open');b.textContent='🙈 Hide Answer'});
});
document.getElementById('btnHideAll').addEventListener('click',function(){
  exerciseList.querySelectorAll('.ex-sol').forEach(function(b){b.classList.add('hidden')});
  exerciseList.querySelectorAll('.show-sol').forEach(function(b){b.classList.remove('open');b.textContent='💡 Show Answer'});
});
document.getElementById('btnReset').addEventListener('click',function(){
  if(!confirm('Lesson '+(currentGroup+1)+'.'+(currentLesson+1)+' ၏ progress ကို reset လုပ်မလား။'))return;
  progress[lessonKey(currentGroup,currentLesson)]={};save();openLesson(currentGroup,currentLesson);
});

buildHome();
</script>
