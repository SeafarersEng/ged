<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f8fafc">
<title>GED RLA — Full Course</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8fafc;--card:#fff;--text:#1e293b;--muted:#64748b;--border:rgba(15,23,42,.09);
--green:#16a34a;--red:#dc2626;--amber:#f59e0b;--radius:18px;--safe-top:env(safe-area-inset-top,0px);
--safe-bottom:env(safe-area-inset-bottom,0px);--shadow:0 1px 3px rgba(15,23,42,.05),0 8px 24px -12px rgba(15,23,42,.15);
--shadow-lg:0 4px 8px rgba(15,23,42,.06),0 20px 40px -16px rgba(15,23,42,.22);--ac:#3b82f6}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100svh;font-family:'Inter','Noto Sans Myanmar','Padauk',system-ui,-apple-system,sans-serif;
background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
background:radial-gradient(700px 420px at 8% -8%,rgba(59,130,246,.10),transparent 65%),
radial-gradient(700px 420px at 100% 4%,rgba(139,92,246,.08),transparent 65%)}
.screen{display:none;min-height:100svh;padding-bottom:calc(40px + var(--safe-bottom))}
.screen.active{display:block}
.home-top{padding:calc(28px + var(--safe-top)) 20px 20px;max-width:1080px;margin:0 auto;text-align:center}
.home-top .logo{width:64px;height:64px;border-radius:18px;margin:0 auto 16px;display:grid;place-items:center;
font-size:15px;font-weight:800;letter-spacing:.5px;color:#fff;background:linear-gradient(135deg,#3b82f6,#8b5cf6);
box-shadow:0 12px 28px -10px rgba(59,130,246,.8)}
.home-top h1{margin:0 0 6px;font-size:clamp(22px,5.5vw,32px);font-weight:800;letter-spacing:-.03em;line-height:1.2}
.home-top p{margin:0;color:var(--muted);font-size:clamp(13px,3.4vw,15px)}
.overall{max-width:440px;margin:20px auto 0;background:var(--card);border:1px solid var(--border);
border-radius:14px;padding:14px 18px;box-shadow:var(--shadow)}
.overall-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.overall-row b{font-size:22px;font-weight:800;color:var(--ac)}
.overall-row span{font-size:12.5px;color:var(--muted);font-weight:600}
.overall-bar{height:8px;border-radius:999px;background:rgba(15,23,42,.07);overflow:hidden}
.overall-bar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--ac),#8b5cf6);
transition:width .6s cubic-bezier(.22,.8,.28,1)}
.grid{max-width:1080px;margin:0 auto;padding:0 16px;display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:600px){.grid{grid-template-columns:repeat(2,1fr);gap:16px}}
@media(min-width:960px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{position:relative;display:flex;flex-direction:column;padding:20px;border-radius:var(--radius);
background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);cursor:pointer;
transition:transform .28s cubic-bezier(.22,.8,.28,1),box-shadow .28s,border-color .28s;overflow:hidden;isolation:isolate;
font-family:inherit;text-align:left;color:inherit;animation:cardIn .5s cubic-bezier(.22,.8,.28,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.card::after{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;
background:radial-gradient(130% 85% at 50% -25%,color-mix(in srgb,var(--c) 14%,transparent),transparent 62%);opacity:0;
transition:opacity .3s;pointer-events:none}
@media(hover:hover){.card:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg);
border-color:color-mix(in srgb,var(--c) 42%,var(--border))}
.card:hover::after{opacity:1}
.card:hover .c-icon{transform:scale(1.08) rotate(-5deg)}
.card:hover .c-arrow{transform:translateX(4px);background:var(--c);color:#fff;border-color:transparent}}
.card:active{transform:scale(.982)}
.c-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.c-icon{width:52px;height:52px;flex:none;display:grid;place-items:center;font-size:26px;border-radius:16px;
background:color-mix(in srgb,var(--c) 14%,transparent);transition:transform .3s cubic-bezier(.22,.8,.28,1)}
.c-arrow{width:30px;height:30px;flex:none;display:grid;place-items:center;font-size:14px;border-radius:50%;
border:1px solid var(--border);color:var(--muted);transition:transform .28s,background .28s,color .28s,border-color .28s}
.card h3{margin:14px 0 0;font-size:16px;font-weight:700;letter-spacing:-.01em;line-height:1.35}
.card .c-desc{margin:5px 0 0;font-size:12.5px;color:var(--muted);line-height:1.7;flex:1}
.c-meta{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:14px;
border-top:1px solid var(--border);font-size:12px;font-weight:600;color:var(--muted)}
.c-meta b{color:var(--c);font-weight:800;font-size:13px}
.c-bar{height:6px;border-radius:999px;background:rgba(15,23,42,.07);overflow:hidden;margin-top:8px}
.c-bar i{display:block;height:100%;width:0;border-radius:999px;background:var(--c);
transition:width .6s cubic-bezier(.22,.8,.28,1)}
.lesson-list{max-width:880px;margin:0 auto;padding:0 16px;display:flex;flex-direction:column;gap:10px}
.lesson-row{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--card);
border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);cursor:pointer;font-family:inherit;
text-align:left;color:inherit;transition:transform .2s,box-shadow .25s,border-color .25s;
animation:cardIn .4s cubic-bezier(.22,.8,.28,1) both}
@media(hover:hover){.lesson-row:hover{transform:translateX(4px);box-shadow:var(--shadow-lg);
border-color:color-mix(in srgb,var(--ac) 35%,var(--border))}}
.lesson-row:active{transform:scale(.985)}
.l-id{flex:none;font-size:12.5px;font-weight:800;color:#fff;padding:5px 10px;border-radius:10px;
background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 60%,#000));
font-variant-numeric:tabular-nums;min-width:46px;text-align:center}
.l-body{flex:1;min-width:0}
.l-body h4{margin:0;font-size:14.5px;font-weight:700;line-height:1.35;letter-spacing:-.01em}
.l-body p{margin:3px 0 0;font-size:11.5px;color:var(--muted);font-weight:600}
.l-prog{flex:none;width:60px;text-align:right}
.l-prog b{display:block;font-size:12px;color:var(--ac);font-weight:800;font-variant-numeric:tabular-nums}
.l-prog .bar{height:5px;border-radius:999px;background:rgba(15,23,42,.08);overflow:hidden;margin-top:5px}
.l-prog .bar i{display:block;height:100%;width:0;border-radius:999px;background:var(--ac);
transition:width .5s cubic-bezier(.22,.8,.28,1)}
.gv-header{position:sticky;top:0;z-index:30;background:rgba(248,250,252,.92);backdrop-filter:blur(14px);
-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:calc(10px + var(--safe-top)) 16px 12px}
.gv-header-inner{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:12px}
.back-btn{display:inline-flex;align-items:center;gap:6px;flex:none;padding:9px 14px;border-radius:12px;
border:1px solid var(--border);background:var(--card);color:var(--text);font-family:inherit;font-size:13px;
font-weight:700;cursor:pointer;box-shadow:var(--shadow);transition:transform .18s}
.back-btn:active{transform:scale(.95)}
.gv-title{flex:1;min-width:0}
.gv-title h2{margin:0;font-size:clamp(14px,3.8vw,17px);font-weight:800;letter-spacing:-.01em;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gv-title p{margin:2px 0 0;font-size:11.5px;color:var(--muted);font-weight:500}
.prog-head{max-width:960px;margin:14px auto 0;padding:0 16px}
.prog-head-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.prog-head-top b{font-size:15px;font-weight:800;color:var(--ac)}
.prog-head-top span{font-size:11.5px;color:var(--muted);font-weight:600}
.prog-head-bar{height:7px;border-radius:999px;background:rgba(15,23,42,.07);overflow:hidden}
.prog-head-bar i{display:block;height:100%;width:0;border-radius:999px;background:var(--ac);
transition:width .5s cubic-bezier(.22,.8,.28,1)}
.toolbar{max-width:960px;margin:14px auto 0;padding:0 16px;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:12px;
border:1px solid var(--border);background:var(--card);color:var(--text);font-family:inherit;
font-size:12.5px;font-weight:600;cursor:pointer;box-shadow:0 1px 3px rgba(15,23,42,.04);
transition:transform .18s,background .2s,color .2s}
.btn:active{transform:scale(.96)}
.btn.danger{color:var(--red);border-color:rgba(220,38,38,.3)}
#exerciseList{max-width:960px;margin:0 auto;padding:16px}
.exercise{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
padding:18px;margin-bottom:12px;box-shadow:var(--shadow);
animation:fadeUp .35s cubic-bezier(.22,.8,.28,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ex-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ex-num{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 8px;border-radius:10px;
font-size:12.5px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 70%,#000));
font-variant-numeric:tabular-nums}
.ex-status{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;color:var(--muted);
background:rgba(15,23,42,.06)}
.ex-status.correct{color:#14532d;background:#bbf7d0}
.ex-status.wrong{color:#7f1d1d;background:#fecaca}
.ex-q{font-size:14.5px;line-height:1.7;margin:6px 0 14px;font-weight:500}
.ex-q b{font-weight:800}
.passage{background:rgba(59,130,246,.05);border-left:3px solid #3b82f6;padding:12px 14px;
border-radius:8px;margin:10px 0;font-size:13.5px;line-height:1.75;font-style:italic}
.ex-opts{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:520px){.ex-opts{grid-template-columns:1fr 1fr}}
.opt{text-align:left;padding:12px 14px;border-radius:12px;border:1.5px solid var(--border);
background:var(--card);color:var(--text);font-family:inherit;font-size:13.5px;font-weight:500;
cursor:pointer;transition:all .18s;line-height:1.5}
.opt:active{transform:scale(.98)}
.opt:not(:disabled):hover{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 4%,transparent)}
.opt:disabled{cursor:default;opacity:.95}
.opt.correct{background:#dcfce7;border-color:var(--green);color:#14532d;font-weight:700}
.opt.wrong{background:#fee2e2;border-color:var(--red);color:#7f1d1d}
.opt .ltr{font-weight:800;margin-right:6px;color:var(--muted)}
.opt.correct .ltr{color:#14532d}
.opt.wrong .ltr{color:#7f1d1d}
.ex-actions{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.show-sol{padding:8px 13px;border-radius:10px;border:1px dashed rgba(245,158,11,.6);
background:rgba(245,158,11,.08);color:#92400e;font-family:inherit;font-size:12.5px;
font-weight:700;cursor:pointer;transition:all .18s}
.show-sol:active{transform:scale(.97)}
.show-sol.open{background:var(--amber);color:#fff;border-style:solid;border-color:transparent}
.ex-sol{margin-top:12px;padding:16px;border-radius:12px;background:color-mix(in srgb,var(--ac) 5%,transparent);
border-left:3px solid var(--ac);font-size:13.5px;line-height:1.8;animation:fadeUp .3s ease both}
.ex-sol .sol-lbl{display:block;font-weight:800;font-size:11px;color:var(--ac);
text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.ex-sol .sol-why{margin-bottom:14px}
.ex-sol ol{margin:6px 0 0;padding-left:20px}
.ex-sol ol li{margin-bottom:5px;line-height:1.7}
.ex-sol .sol-ans{display:inline-block;margin-top:12px;padding:5px 12px;border-radius:8px;
background:#dcfce7;color:#14532d;font-weight:800;font-size:13px}
.hidden{display:none!important}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div id="homeScreen" class="screen active">
  <div class="home-top">
    <div class="logo">RLA</div>
    <h1>GED RLA — Full Course</h1>
    <p>6 Groups · 60 Lessons · 1,800 Practice Questions</p>
    <div class="overall">
      <div class="overall-row"><b id="overallPct">0%</b><span id="overallCount">0 / 1,800 ပြီးစီး</span></div>
      <div class="overall-bar"><i id="overallBar"></i></div>
    </div>
  </div>
  <div class="grid" id="groupGrid"></div>
</div>

<div id="groupScreen" class="screen">
  <div class="gv-header">
    <div class="gv-header-inner">
      <button class="back-btn" id="backFromGroup">← Back</button>
      <div class="gv-title"><h2 id="gTitle"></h2><p id="gSub"></p></div>
    </div>
  </div>
  <div class="prog-head">
    <div class="prog-head-top"><b id="gPct">0%</b><span id="gCount">0 / 300</span></div>
    <div class="prog-head-bar"><i id="gBar"></i></div>
  </div>
  <div class="lesson-list" id="lessonList"></div>
</div>

<div id="lessonScreen" class="screen">
  <div class="gv-header">
    <div class="gv-header-inner">
      <button class="back-btn" id="backFromLesson">← Back</button>
      <div class="gv-title"><h2 id="lTitle"></h2><p id="lSub"></p></div>
    </div>
  </div>
  <div class="prog-head">
    <div class="prog-head-top"><b id="lPct">0%</b><span id="lCount">0 / 30</span></div>
    <div class="prog-head-bar"><i id="lBar"></i></div>
  </div>
  <div class="toolbar">
    <button class="btn" id="btnShowAll">💡 Show All Answers</button>
    <button class="btn" id="btnHideAll">🙈 Hide All Answers</button>
    <button class="btn danger" id="btnReset">🔄 Reset</button>
  </div>
  <div id="exerciseList"></div>
</div>

<script>
/* ============ HELPERS ============ */
const sr=s=>{const x=Math.sin(s*12.9898+78.233)*43758.5453;return x-Math.floor(x)};
const pick=(s,arr)=>arr[Math.floor(sr(s)*arr.length)];
const shuffle=(a,s)=>{const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(sr(s+i*13.37)*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r};
function mcq(correct,distractors,seed){
  const c=String(correct);const opts=[c];
  for(const d of distractors){if(opts.length>=4)break;const s=String(d);if(s!==c&&!opts.includes(s))opts.push(s)}
  let k=1;
  while(opts.length<4){opts.push(c+' (variant '+k+')');k++;if(k>10)break}
  const sh=shuffle(opts,seed);return{options:sh,correctIndex:sh.indexOf(c)};
}
function Q(q,correct,distractors,why,steps,seed){
  const m=mcq(correct,distractors,seed);
  return{q,options:m.options,correctIndex:m.correctIndex,why,steps,answer:String(correct)};
}

/* ============================================================
   GROUP 1 — READING: INFORMATIONAL TEXT
============================================================ */
const G1 = [
// 1.1 Main Idea
s=>{
  const P=[
    ['Rainforests produce roughly 20% of the world\'s oxygen and are home to more than half of all plant and animal species. They also regulate global weather patterns.',
     'Rainforests are vital to the planet\'s health',
     ['Rainforests are located near the equator','Rainforests contain many trees','Rainforests are shrinking quickly']],
    ['Regular exercise improves cardiovascular health, strengthens muscles, and boosts mental well-being. Even 30 minutes a day can significantly reduce the risk of chronic disease.',
     'Regular exercise offers many health benefits',
     ['Exercise should be done in the morning','Only athletes need to exercise','30 minutes is the only useful amount']],
    ['The invention of the printing press in the 15th century made books affordable and widely available. This led to a rapid increase in literacy and the spread of new ideas across Europe.',
     'The printing press greatly increased literacy and the spread of ideas',
     ['The printing press was invented in Germany','Books are important for education','Europe had many inventors']],
    ['Climate change is caused primarily by the burning of fossil fuels, which release carbon dioxide into the atmosphere. This traps heat and raises global temperatures.',
     'Burning fossil fuels is the main cause of climate change',
     ['Fossil fuels are expensive','Global temperatures change naturally','Carbon dioxide is harmless']],
    ['Sleep plays a critical role in memory, learning, and emotional regulation. Adults who consistently get fewer than seven hours of sleep are at higher risk for several health problems.',
     'Adequate sleep is essential for health and mental function',
     ['Sleep should be eight hours','Children need more sleep than adults','Naps are unhealthy']],
    ['Many cities are investing in public transportation to reduce traffic congestion and air pollution. Buses and trains can move far more people than private cars using the same road space.',
     'Public transportation helps reduce traffic and pollution',
     ['Cities are becoming overcrowded','Private cars are better than buses','Air pollution only affects cities']],
    ['The internet has transformed how people access information, communicate, and conduct business. It has also created new challenges, including concerns about privacy and misinformation.',
     'The internet has had both positive and negative effects',
     ['The internet is only useful for business','Privacy is no longer a concern','Misinformation is rare online']],
    ['Honeybees are essential pollinators for many crops, including fruits, vegetables, and nuts. Their decline threatens global food supplies and agricultural economies.',
     'Honeybees are critical to food production',
     ['Honeybees produce honey','Honeybees live in hives','All insects are declining']]
  ];
  const [text,correct,dist]=pick(s,P);
  return Q(`Read the passage:<div class="passage">${text}</div>What is the main idea of the passage?`,
    correct, dist,
    'Main idea သည် passage တစ်ခုလုံး၏ အဓိကအကြောင်းအရာ ဖြစ်သည်။ Topic သာမက ဘာပြောချင်သည် ဆိုတာကိုပါ ဖမ်းရမည်။',
    ['Passage တစ်ခုလုံး ဖတ်ပါ','ထပ်ခါထပ်ခါ ပြောထားသည့် အကြောင်းအရာကို ရှာပါ',
     `အဖြေမှာ "${correct}" — passage တစ်ခုလုံး ဒီအချက်ကို အဓိကထား ဆွေးနွေးထားသည်`],
    s+1);
},
// 1.2 Supporting Details
s=>{
  const P=[
    ['The Eiffel Tower, built in 1889 for the World\'s Fair, stands 1,083 feet tall. It was the tallest structure in the world until 1930 and receives about 7 million visitors each year.',
     'It was built in 1889','1889','Who built it','What color it is'],
    ['Mount Everest is the tallest mountain on Earth, reaching 29,032 feet above sea level. It was first summited in 1953 by Edmund Hillary and Tenzing Norgay.',
     '1953','1920','Every year','Never'],
    ['The human heart beats about 100,000 times per day and pumps roughly 2,000 gallons of blood through the body. It has four chambers that work together.',
     'About 100,000 times','About 500 times','About 1 million times','10 times'],
    ['The Pacific Ocean is the largest and deepest ocean on Earth, covering about one-third of the planet. Its deepest point, the Mariana Trench, is nearly 36,000 feet deep.',
     'One-third of the planet','Half of the planet','A quarter of the planet','A tenth of the planet'],
    ['Photosynthesis is the process by which plants use sunlight, water, and carbon dioxide to produce glucose and oxygen. It takes place mainly in the leaves.',
     'Sunlight, water, and carbon dioxide','Water and soil','Only sunlight','Sugar and water'],
    ['The Great Wall of China was built over many centuries by several dynasties. Its total length is estimated at over 13,000 miles, including all branches.',
     'Over 13,000 miles','About 500 miles','1,000 miles','100,000 miles']
  ];
  const [text,correct,d1,d2,d3]=pick(s,P);
  const m=mcq(correct,[d1,d2,d3],s+1);
  return{q:`Read the passage:<div class="passage">${text}</div>According to the passage, which of the following is correct?`,
    options:m.options,correctIndex:m.correctIndex,
    why:'Supporting details သည် passage ထဲတွင် တိုက်ရိုက်ဖော်ပြထားသည့် အချက်အလက်များ ဖြစ်သည်။ ဖတ်ထားသည့်အတိုင်း ပြန်ရှာပါ။',
    steps:['Passage ထဲရှိ ကိန်းဂဏန်း၊ ရက်စွဲ၊ အမည်များကို ဂရုပြုဖတ်ပါ',
      `Passage တွင် "${correct}" ဟု ဖော်ပြထားသည်`,
      'ကျန်ရွေးချယ်စရာများသည် passage တွင် မပါဝင်ပါ'],
    answer:String(correct)};
},
// 1.3 Author's Purpose
s=>{
  const P=[
    ['Buy now and save 30%! This limited-time offer ends Friday. Don\'t miss out on the deal of the season.','Persuade'],
    ['First, preheat the oven to 350°F. Then, mix the flour and sugar in a large bowl.','Instruct'],
    ['The American Civil War began in 1861 and lasted until 1865, resulting in over 600,000 casualties.','Inform'],
    ['The wind howled through the trees, and the leaves danced wildly in the darkness.','Entertain'],
    ['Studies show that 8 out of 10 dentists recommend brushing twice daily for optimal oral health.','Inform'],

      '"The author states" → Summary','"The author\'s use of ___ strengthens" → Analysis',
      `ဤ sentence = "${correct}"`],
    answer:correct};
},
// 6.9 Paragraph Flow
s=>{
  const P=[
    ['Topic sentence → Evidence → Explanation → Transition','Best structure'],
    ['Evidence → Topic sentence → Transition → Explanation','Less effective'],
    ['Explanation → Evidence → Topic sentence → Transition','Poor structure'],
    ['Transition → Topic sentence → Evidence → Explanation','Also strong'],
    ['Topic sentence → Explanation → Transition → Evidence','Weak flow']
  ];
  const [text,correct]=pick(s,P);
  const opts=['Best structure','Less effective','Poor structure','Also strong','Weak flow'];
  const m=mcq(correct,opts.filter(o=>o!==correct).slice(0,3),s+1);
  return{q:`Which is the MOST effective paragraph structure?`,
    options:m.options,correctIndex:m.correctIndex,
    why:'Effective body paragraph = Topic sentence → Evidence → Analysis/Explanation → Transition။',
    steps:['Topic sentence က claim ကို ဖော်ပြသည်','Evidence က support လုပ်သည်',
      'Explanation က evidence ကို ရှင်းပြသည်','Transition က နောက် paragraph သို့ ချိတ်သည်',
      `Best = "${correct}"`],
    answer:correct};
},
// 6.10 Extended Response Strategy
s=>{
  const P=[
    ['Read the prompt carefully, identify the task, plan, write, and revise.','Correct strategy for Extended Response'],
    ['Write immediately without reading the prompt fully.','Poor strategy'],
    ['Use evidence from BOTH passages to support your argument.','Correct strategy'],
    ['Write about your personal opinion only, without evidence.','Poor strategy'],
    ['Include a clear thesis statement in the introduction.','Correct strategy'],
    ['Skip the introduction and just list ideas.','Poor strategy'],
    ['Address a counterargument and refute it.','Correct strategy'],
    ['Avoid citing specific passages.','Poor strategy'],
    ['Organize ideas with clear paragraphs and transitions.','Correct strategy'],
    ['Write one long paragraph with no structure.','Poor strategy']
  ];
  const [text,correct]=pick(s,P);
  const opts=['Correct strategy for Extended Response','Poor strategy'];
  const m=mcq(correct,opts.filter(o=>o!==correct),s+1);
  return{q:`Is this a correct or poor strategy for the GED Extended Response?<div class="passage">${text}</div>`,
    options:m.options,correctIndex:m.correctIndex,
    why:'GED Extended Response (45 min) — Read prompt → Analyze BOTH passages → Write thesis + evidence + counterargument + conclusion။',
    steps:['Prompt ကို သေချာဖတ်ပါ','Passages ၂ ခုလုံးမှ evidence ယူပါ',
      'Thesis + reasons + counterargument ပါပါ','Structure ရှိရှိ ရေးပါ',
      `ဤ strategy = "${correct}"`],
    answer:correct}
}
];

/* ============================================================
   GROUPS DEFINITIONS
============================================================ */
const GROUPS=[
  {title:'Reading: Informational Text',icon:'📄',ac:'#3b82f6',
   desc:'Main idea, details, purpose, structure, inference, argument analysis.',
   gens:G1,
   lessons:['Main Idea & Central Theme','Supporting Details','Author\'s Purpose','Text Structure',
     'Summarizing','Making Inferences','Compare Two Texts','Identifying Claims',
     'Evaluating Evidence','Fact vs Opinion']},
  {title:'Reading: Literature & Fiction',icon:'📖',ac:'#8b5cf6',
   desc:'Plot, character, theme, POV, figurative language, tone, irony, conflict.',
   gens:G2,
   lessons:['Plot Elements','Character Analysis','Theme','Point of View',
     'Figurative Language','Tone & Mood','Irony','Conflict',
     'Dialogue Analysis','Context Clues in Literature']},
  {title:'Grammar & Language Conventions',icon:'✏️',ac:'#ec4899',
   desc:'Subject-verb agreement, tense, pronouns, punctuation, parallel structure.',
   gens:G3,
   lessons:['Subject-Verb Agreement','Verb Tense','Pronoun Agreement','Pronoun Case',
     'Comma Rules','Semicolons & Colons','Apostrophes','Parallel Structure',
     'Modifier Placement','Fragments & Run-ons']},
  {title:'Writing: Sentences & Paragraphs',icon:'📝',ac:'#f59e0b',
   desc:'Sentence variety, transitions, topic sentences, coherence, word choice, tone.',
   gens:G4,
   lessons:['Sentence Variety','Combining Sentences','Transitions','Topic Sentences',
     'Paragraph Coherence','Word Choice','Formal Tone','Active vs Passive Voice',
     'Concise Writing','Revising for Clarity']},
  {title:'Vocabulary & Word Analysis',icon:'📚',ac:'#10b981',
   desc:'Context clues, prefixes, suffixes, roots, synonyms, idioms, connotation.',
   gens:G5,
   lessons:['Context Clues','Prefixes','Suffixes','Root Words',
     'Synonyms & Antonyms','Homophones','Multiple-Meaning Words','Idioms',
     'Connotation & Denotation','Analogies']},
  {title:'Argumentation & Essay Writing',icon:'🎯',ac:'#06b6d4',
   desc:'Claims, evidence, fallacies, counterarguments, essay structure, thesis.',
   gens:G6,
   lessons:['Identifying Claims','Types of Evidence','Logical Fallacies','Counterarguments',
     'Essay Structure','Thesis Statements','Citing Evidence','Analysis vs Summary',
     'Paragraph Flow','Extended Response Strategy']}
];

const EX_PER_LESSON=30, EX_PER_GROUP=300, TOTAL_EX=1800;

/* ============================================================
   STATE
============================================================ */
const STORE='ged:rla:v1';
let progress={};
try{progress=JSON.parse(localStorage.getItem(STORE))||{}}catch(e){}
function save(){try{localStorage.setItem(STORE,JSON.stringify(progress))}catch(e){}}
function lessonKey(gi,li){return `${gi}-${li}`}
function lessonProg(gi,li){const k=lessonKey(gi,li);if(!progress[k])progress[k]={};return progress[k]}
const cache={};

/* ============================================================
   SCREENS
============================================================ */
const homeScreen=document.getElementById('homeScreen');
const groupScreen=document.getElementById('groupScreen');
const lessonScreen=document.getElementById('lessonScreen');
let currentGroup=-1,currentLesson=-1;

function showOnly(screen){
  [homeScreen,groupScreen,lessonScreen].forEach(s=>s.classList.remove('active'));
  screen.classList.add('active');
  window.scrollTo(0,0);
}

/* ============================================================
   HOME
============================================================ */
const groupGrid=document.getElementById('groupGrid');
function buildHome(){
  groupGrid.innerHTML='';
  GROUPS.forEach((g,gi)=>{
    let done=0;
    for(let li=0;li<10;li++){
      const p=progress[lessonKey(gi,li)]||{};
      done+=Object.values(p).filter(v=>v===true).length;
    }
    const pct=Math.round(done/EX_PER_GROUP*100);
    const card=document.createElement('button');
    card.className='card';
    card.style.setProperty('--c',g.ac);
    card.style.animationDelay=(gi*60)+'ms';
    card.innerHTML=`
      <div class="c-top">
        <span class="c-icon">${g.icon}</span>
        <span class="c-arrow">→</span>
      </div>
      <h3>Group ${gi+1} — ${g.title}</h3>
      <p class="c-desc">${g.desc}</p>
      <div class="c-meta"><span>10 lessons · 300 questions</span><b>${pct}%</b></div>
      <div class="c-bar"><i style="width:${pct}%"></i></div>
    `;
    card.addEventListener('click',()=>openGroup(gi));
    groupGrid.appendChild(card);
  });
  updateOverall();
}
function updateOverall(){
  let total=0;
  for(let gi=0;gi<6;gi++)
    for(let li=0;li<10;li++)
      total+=Object.values(progress[lessonKey(gi,li)]||{}).filter(v=>v===true).length;
  const pct=Math.round(total/TOTAL_EX*100);
  document.getElementById('overallPct').textContent=pct+'%';
  document.getElementById('overallCount').textContent=`${total.toLocaleString()} / ${TOTAL_EX.toLocaleString()} ပြီးစီး`;
  document.getElementById('overallBar').style.width=pct+'%';
}

/* ============================================================
   GROUP VIEW
============================================================ */
const lessonListEl=document.getElementById('lessonList');
const gTitleEl=document.getElementById('gTitle');
const gSubEl=document.getElementById('gSub');
const gPctEl=document.getElementById('gPct');
const gCountEl=document.getElementById('gCount');
const gBarEl=document.getElementById('gBar');

function openGroup(gi){
  currentGroup=gi;
  const g=GROUPS[gi];
  document.documentElement.style.setProperty('--ac',g.ac);
  gTitleEl.textContent=`Group ${gi+1} — ${g.title}`;
  gSubEl.textContent=g.desc;
  buildLessonList(gi);
  refreshGroupStats(gi);
  showOnly(groupScreen);
}
function buildLessonList(gi){
  const g=GROUPS[gi];
  lessonListEl.innerHTML='';
  g.lessons.forEach((title,li)=>{
    const p=progress[lessonKey(gi,li)]||{};
    const done=Object.values(p).filter(v=>v===true).length;
    const pct=Math.round(done/EX_PER_LESSON*100);
    const row=document.createElement('button');
    row.className='lesson-row';
    row.style.animationDelay=(li*40)+'ms';
    row.innerHTML=`
      <span class="l-id">${gi+1}.${li+1}</span>
      <div class="l-body">
        <h4>${title}</h4>
        <p>${EX_PER_LESSON} exercises</p>
      </div>
      <div class="l-prog">
        <b>${done}/${EX_PER_LESSON}</b>
        <div class="bar"><i style="width:${pct}%"></i></div>
      </div>
    `;
    row.addEventListener('click',()=>openLesson(gi,li));
    lessonListEl.appendChild(row);
  });
}
function refreshGroupStats(gi){
  if(gi!==currentGroup) return;
  let done=0;
  for(let li=0;li<10;li++){
    const p=progress[lessonKey(gi,li)]||{};
    done+=Object.values(p).filter(v=>v===true).length;
  }
  const pct=Math.round(done/EX_PER_GROUP*100);
  gPctEl.textContent=pct+'%';
  gCountEl.textContent=`${done} / ${EX_PER_GROUP}`;
  gBarEl.style.width=pct+'%';
}
document.getElementById('backFromGroup').addEventListener('click',()=>{buildHome();showOnly(homeScreen)});

/* ============================================================
   LESSON VIEW
============================================================ */
const exerciseList=document.getElementById('exerciseList');
const lTitleEl=document.getElementById('lTitle');
const lSubEl=document.getElementById('lSub');
const lPctEl=document.getElementById('lPct');
const lCountEl=document.getElementById('lCount');
const lBarEl=document.getElementById('lBar');

function generateLesson(gi,li){
  const key=lessonKey(gi,li);
  if(cache[key]) return cache[key];
  const gen=GROUPS[gi].gens[li];
  const arr=[];
  for(let i=0;i<EX_PER_LESSON;i++){
    const seed=gi*1000000+li*1000+i*17+13;
    arr.push(gen(seed));
  }
  cache[key]=arr;
  return arr;
}
function openLesson(gi,li){
  currentGroup=gi; currentLesson=li;
  const g=GROUPS[gi];
  document.documentElement.style.setProperty('--ac',g.ac);
  lTitleEl.textContent=`${gi+1}.${li+1} — ${g.lessons[li]}`;
  lSubEl.textContent=`Group ${gi+1} · ${EX_PER_LESSON} exercises`;
  const arr=generateLesson(gi,li);
  renderExercises(arr,gi,li);
  refreshLessonStats(gi,li);
  showOnly(lessonScreen);
}
function refreshLessonStats(gi,li){
  if(gi!==currentGroup||li!==currentLesson) return;
  const p=progress[lessonKey(gi,li)]||{};
  const done=Object.values(p).filter(v=>v===true).length;
  const pct=Math.round(done/EX_PER_LESSON*100);
  lPctEl.textContent=pct+'%';
  lCountEl.textContent=`${done} / ${EX_PER_LESSON}`;
  lBarEl.style.width=pct+'%';
}

const LTRS=['A','B','C','D'];
function renderExercises(arr,gi,li){
  const p=lessonProg(gi,li);
  exerciseList.innerHTML='';
  const frag=document.createDocumentFragment();
  arr.forEach((e,idx)=>frag.appendChild(buildCard(e,idx,gi,li,p[idx])));
  exerciseList.appendChild(frag);
}
function buildCard(e,idx,gi,li,saved){
  const wrap=document.createElement('div');
  wrap.className='exercise';
  const status=saved===true?'<span class="ex-status correct">✔ Correct</span>'
    :saved===false?'<span class="ex-status wrong">✘ Wrong</span>'
    :'<span class="ex-status">— Not answered</span>';
  wrap.innerHTML=`
    <div class="ex-head">
      <span class="ex-num">${idx+1}</span>
      ${status}
    </div>
    <div class="ex-q">${e.q}</div>
    <div class="ex-opts">
      ${e.options.map((o,i)=>`<button class="opt" data-i="${i}"><span class="ltr">${LTRS[i]}.</span>${o}</button>`).join('')}
    </div>
    <div class="ex-actions">
      <button class="show-sol">💡 Show Answer</button>
    </div>
    <div class="ex-sol hidden">
      <div class="sol-why">
        <span class="sol-lbl">အဘယ်ကြောင့်</span>
        ${e.why}
      </div>
      <div>
        <span class="sol-lbl">ရှင်းလင်းချက် အဆင့်ဆင့်</span>
        <ol>${e.steps.map(s=>`<li>${s}</li>`).join('')}</ol>
      </div>
      <span class="sol-ans">✔ အဖြေ: ${e.answer}</span>
    </div>
  `;
  const opts=wrap.querySelectorAll('.opt');
  const solBox=wrap.querySelector('.ex-sol');
  const solBtn=wrap.querySelector('.show-sol');
  const statusEl=wrap.querySelector('.ex-status');

  if(saved===true||saved===false){
    opts.forEach((b,i)=>{b.disabled=true;if(i===e.correctIndex)b.classList.add('correct')});
  }
  opts.forEach((b,i)=>{
    b.addEventListener('click',()=>{
      if(b.disabled) return;
      const ok=i===e.correctIndex;
      opts.forEach(x=>x.disabled=true);
      b.classList.add(ok?'correct':'wrong');
      if(!ok) opts[e.correctIndex].classList.add('correct');
      statusEl.className='ex-status '+(ok?'correct':'wrong');
      statusEl.textContent=ok?'✔ Correct':'✘ Wrong';
      lessonProg(gi,li)[idx]=ok;
      save();
      refreshLessonStats(gi,li);
      if(!ok){
        solBox.classList.remove('hidden');
        solBtn.classList.add('open');
        solBtn.textContent='🙈 Hide Answer';
      }
    });
  });
  solBtn.addEventListener('click',()=>{
    solBox.classList.toggle('hidden');
    const open=!solBox.classList.contains('hidden');
    solBtn.classList.toggle('open',open);
    solBtn.textContent=open?'🙈 Hide Answer':'💡 Show Answer';
  });
  return wrap;
}
document.getElementById('backFromLesson').addEventListener('click',()=>{
  buildLessonList(currentGroup);
  refreshGroupStats(currentGroup);
  showOnly(groupScreen);
});

/* ============================================================
   TOOLBAR
============================================================ */
document.getElementById('btnShowAll').addEventListener('click',()=>{
  exerciseList.querySelectorAll('.ex-sol').forEach(b=>b.classList.remove('hidden'));
  exerciseList.querySelectorAll('.show-sol').forEach(b=>{b.classList.add('open');b.textContent='🙈 Hide Answer'});
});
document.getElementById('btnHideAll').addEventListener('click',()=>{
  exerciseList.querySelectorAll('.ex-sol').forEach(b=>b.classList.add('hidden'));
  exerciseList.querySelectorAll('.show-sol').forEach(b=>{b.classList.remove('open');b.textContent='💡 Show Answer'});
});
document.getElementById('btnReset').addEventListener('click',()=>{
  if(!confirm(`Lesson ${currentGroup+1}.${currentLesson+1} ၏ progress ကို reset လုပ်မလား။`)) return;
  progress[lessonKey(currentGroup,currentLesson)]={};
  save();
  openLesson(currentGroup,currentLesson);
});

buildHome();
</script>
